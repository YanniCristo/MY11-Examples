<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SmashCrop PDF & Image: rimuovi sezioni di foto e PDF e ricongiungi il resto.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0A0B10">

  <!--
    Uncomment the tag below to lay the app out underneath the parts of the
    screen that the device obstructs, such as a display cutout, the rounded
    corners of the screen, or a home indicator.

    Without it, the browser keeps the app clear of them, and `SafeArea` and
    `MediaQuery.paddingOf` report no padding. With it, the app covers the whole
    screen, and it is up to the app to keep its own content out of the way,
    which is what `SafeArea` is for.
  -->
  <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"> -->

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SmashCrop">
  <link rel="apple-touch-icon" href="icons/Icon-180.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SmashCrop</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="margin:0;background:#0A0B10">
  <div id="splash" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#0A0B10;font-family:system-ui,sans-serif;color:#9CA3AF">
    <img src="icons/Icon-192.png" alt="" width="96" height="96" style="border-radius:22px">
    <div style="font-weight:800;font-size:24px;letter-spacing:-.3px"><span style="color:#E5172F">SMASH</span><span style="color:#F3F4F6">CROP</span></div>
    <div id="splash-text" style="font-size:14px">Loading…</div>
  </div>
  <script>window.addEventListener('flutter-first-frame',function(){var s=document.getElementById('splash');if(s)s.remove();});</script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
<script>
  (function () {
    var t = {it: 'Caricamento…', en: 'Loading…', fr: 'Chargement…', es: 'Cargando…', pt: 'Carregando…', de: 'Wird geladen…'};
    var langs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || 'en'];
    var pick = 'en';
    try {
      var saved = localStorage.getItem('flutter.language');
      if (saved) pick = JSON.parse(saved);
      else for (var i = 0; i < langs.length; i++) { var c = String(langs[i]).slice(0, 2).toLowerCase(); if (t[c]) { pick = c; break; } }
    } catch (e) {}
    var el = document.getElementById('splash-text');
    if (el && t[pick]) el.textContent = t[pick];
    document.documentElement.lang = pick;
  })();
</script>
</body>
</html>
